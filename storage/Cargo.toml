[package]
name = "hypom-storage"
version.workspace = true
edition.workspace = true

[dependencies]
hypom-core = { path = "../core" }
walkdir = "2"
notify = "7"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "6"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
